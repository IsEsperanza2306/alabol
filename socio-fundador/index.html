<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Modelo de negocio | Alabol Car Broker</title>
<link rel="icon" href="/logo-circular.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/subastas/catalogo.css?v=2">
</head>
<body>
<div class="loader" id="vLoading"><div class="spin"></div><span>Verificando acceso…</span></div>
<section class="gate wrap" id="vGate" hidden>
  <div class="gate-card">
    <img class="logo" src="/logo-circular.png" alt="Alabol">
    <div><h1>Documento privado</h1><p class="sub" id="gTxt">Este modelo de negocio es solo para socios invitados por Alabol Car Broker.</p></div>
    <a class="btn gold" href="/login.html?redirect=socio-fundador/">Entrar</a>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/525568667571?text=Hola%20Alabol%2C%20quiero%20acceso%20al%20modelo%20de%20socio%20fundador">Solicitar acceso por WhatsApp</a>
    <a class="btn ghost sm" href="/">← Volver a alabolcar.com.mx</a>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
(async () => {
  const sb = window.supabaseClient, show = id => ['vLoading','vGate'].forEach(v => document.getElementById(v).hidden = v !== id);
  if (!sb) return show('vGate');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('vGate');
  const { data, error } = await sb.from('paginas_privadas').select('html').eq('slug', 'socio-fundador').maybeSingle();
  if (error || !data) { document.getElementById('gTxt').textContent = session.user.email + ' aún no tiene acceso a este documento. Pídelo a tu asesor de Alabol.'; return show('vGate'); }
  try { sb.from('catalogo_bitacora').insert({ user_id: session.user.id, accion: 'ver_unidad', unidad_ref: 'socio-fundador', user_agent: navigator.userAgent.slice(0, 180) }).then(() => {}); } catch (_) {}
  document.open(); document.write(data.html); document.close();
})();
</script>
</body>
</html>

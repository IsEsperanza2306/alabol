<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Alabol Car Broker</title>
<script>
  // GitHub Pages no soporta rewrites: reemplaza los de _redirects de Netlify
  (function () {
    var p = location.pathname.split('/').filter(Boolean);
    if (p[0] === 'agencia' && p[1]) {
      location.replace('/agencia-showroom.html?agencia=' + encodeURIComponent(p[1]));
    } else if (p[0] === 'certificado' && p[1]) {
      location.replace('/certificado/?folio=' + encodeURIComponent(p[1]));
    } else {
      location.replace('/');
    }
  })();
</script>
</head>
<body></body>
</html>
